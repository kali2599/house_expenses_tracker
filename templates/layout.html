<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Expenses Tracker</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="nav">
  <span class="nav-title">House Expenses Tracker</span>
  <a href="/add-expense">Add Expense</a>
  <div class="nav-dropdown">
    <span class="nav-dropdown-trigger">Data Analysis ▾</span>
    <div class="nav-dropdown-content">
      <a href="/data-analysis/tracking" class="{% if active_view|default('') == 'tracking' %}nav-active{% endif %}">Tracciamento</a>
      <a href="/data-analysis/comparison" class="{% if active_view|default('') == 'comparison' %}nav-active{% endif %}">Confronto</a>
      <a href="/data-analysis/history" class="{% if active_view|default('') == 'history' %}nav-active{% endif %}">Storico</a>
    </div>
  </div>
  <a href="/undo-expense">Undo Expense</a>
  <span class="nav-year">
    Year: {{ current_year }}
    <a href="/change-year" class="small-link">[change]</a>
  </span>
</div>
<div id="content">
{% for category, message in get_flashed_messages(with_categories=true) %}
  <div class="flash {{ category }}">{{ message }}</div>
{% endfor %}
{% block content %}{% endblock %}
</div>
<script>
function toggleDropdown(e) {
  e.stopPropagation();
  document.querySelector('.nav-dropdown').classList.toggle('open');
}
document.addEventListener('click', function() {
  document.querySelector('.nav-dropdown').classList.remove('open');
});
document.addEventListener('DOMContentLoaded', function() {
  var trigger = document.querySelector('.nav-dropdown-trigger');
  if (trigger) trigger.addEventListener('click', toggleDropdown);
});
</script>
</body>
</html>
