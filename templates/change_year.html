{% extends "layout.html" %}
{% block content %}
<h2>Change Year</h2>

<p>Current year: <strong>{{ current_year }}</strong></p>

<form method="post">
  <label>New year:</label>
  <input type="number" name="year" value="{{ current_year }}" min="2000" max="2100">
  <button type="submit">Change</button>
</form>
{% endblock %}
